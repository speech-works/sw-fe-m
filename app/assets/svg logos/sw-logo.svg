<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speechworks mark: single source of truth. Everything else in this folder,
  plus app/assets/{icon,adaptive-icon*,splash-icon,play-store-icon,favicon}.png,
  is generated from this file by scripts/build-logo-assets.mjs. Edit here only.

  The mark's own box is 436.58 x 507.64. It is placed by `transform` so its
  bounding box is centred on (627, 627), the centre of the 1254 viewBox, because
  every generated composition positions it with `translate(-627 -627)`. Those two
  numbers are mirrored in the build script as MARK_W / MARK_H, which derives
  every scale from them; change the mark and you change them together.

  Geometry is exact: the two bar corners are elliptical arcs, the bowl's corners
  are tangent-continuous cubics (horizontal at the base, vertical at the side),
  and the two slashes are parallel straight cuts sharing slope 0.389341. Do not
  re-trace this from a bitmap; a trace replaces the curves with drifting cubics
  and splits the single fill into several near-identical oranges.
-->
